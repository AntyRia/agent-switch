[package]
name = "agent-switch-cli"
version = "0.2.5"
edition = "2021"
repository = "https://github.com/AntyRia/agent-switch"

# Spec uses `agent-switch` as the command name; keep the package name for
# path dependencies, rename the built binary via an explicit bin target.
[[bin]]
name = "agent-switch"
path = "src/main.rs"

[dependencies]
agent-switch-core = { path = "../agent-switch-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
