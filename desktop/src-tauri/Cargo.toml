[package]
name = "agent_switch_desktop"
version = "0.2.5"
edition = "2021"
repository = "https://github.com/AntyRia/agent-switch"

[lib]
name = "agent_switch_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
agent-switch-core = { path = "../../crates/agent-switch-core" }
notify = "6"
tauri-plugin-opener = "2.5.5"

# Keep this crate in its own workspace so it maintains its own target/ dir
# and does not join the root ModelDock/agent-switch workspace.
[workspace]
