name: Release macOS

on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - '.github/workflows/release-macos.yml'
      - 'scripts/install.*'
      - 'tests/test_install.py'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUST_TARGET: aarch64-apple-darwin
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Check platform and version
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          test "${RELEASE_TAG#v}" = "$(node -p 'require("./desktop/package.json").version')"
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$RUST_TARGET"
      - name: Test and build CLI
        shell: bash
        run: |
          python3 -m unittest discover -s tests -p 'test_install.py'
          cargo test --locked --target "$RUST_TARGET"
          cargo build --locked --release --target "$RUST_TARGET"
          test "$("$CARGO_TARGET_DIR/$RUST_TARGET/release/agent-switch" --version)" = "agent-switch ${RELEASE_TAG#v}"
      - name: Build GUI
        working-directory: desktop
        run: |
          npm ci
          npx tsc --noEmit
          npm run tauri build -- --target "$RUST_TARGET" --bundles dmg --ci -- --locked
      - name: Verify and package
        shell: bash
        run: |
          verify() {
            local output
            if output=$("$@" 2>&1); then
              printf '%s\n' "$output"
            else
              output="${output//'%'/'%25'}"
              output="${output//$'\n'/'%0A'}"
              output="${output//$'\r'/'%0D'}"
              printf '::error title=Package verification::%s: %s\n' "$1" "$output"
              return 1
            fi
          }
          VERSION="${RELEASE_TAG#v}"
          OUT="$RUNNER_TEMP/release"
          BUILD="$CARGO_TARGET_DIR/$RUST_TARGET/release"
          mkdir -p "$OUT"
          verify cp "$BUILD/bundle/dmg/Agent Switch_${VERSION}_aarch64.dmg" "$OUT/Agent.Switch_${VERSION}_aarch64.dmg"
          verify hdiutil verify "$OUT/Agent.Switch_${VERSION}_aarch64.dmg"
          MOUNT="$RUNNER_TEMP/dmg-check"
          mkdir -p "$MOUNT"
          verify hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT" "$OUT/Agent.Switch_${VERSION}_aarch64.dmg"
          trap 'hdiutil detach "$MOUNT" -quiet || true' EXIT
          verify codesign --verify --deep --strict "$MOUNT/Agent Switch.app"
          verify hdiutil detach "$MOUNT"
          trap - EXIT
          ARCH="$(lipo -archs "$BUILD/agent-switch")"
          if [ "$ARCH" != arm64 ]; then
            echo "::error::Expected an arm64 CLI, found $ARCH"
            exit 1
          fi
          zip -j "$OUT/agent-switch-${VERSION}-aarch64-apple-darwin.zip" "$BUILD/agent-switch"
          cd "$OUT"
          shasum -a 256 "Agent.Switch_${VERSION}_aarch64.dmg" "agent-switch-${VERSION}-aarch64-apple-darwin.zip" > SHA256SUMS.txt
          shasum -a 256 -c SHA256SUMS.txt
      - name: Prepare release notes
        shell: python
        run: |
          import os
          from pathlib import Path
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          changelog = Path('CHANGELOG.md').read_text()
          section = changelog.split(f'## [{version}]', 1)[1].split('\n## [', 1)[0]
          notes = f'Agent Switch {version}\n\n' + section.split('\n', 1)[1].strip()
          notes += '\n\n### Installation / 安装\n\n'
          notes += 'Open the DMG and drag Agent Switch to Applications, or extract the CLI ZIP and place agent-switch on PATH. Codex CLI / Claude Code must be installed separately.\n\n'
          notes += 'The app is ad-hoc signed and not notarized by Apple. Check SHA256SUMS.txt before opening it. If macOS blocks an app you trust, use System Settings → Privacy & Security → Open Anyway.\n\n'
          notes += '打开 DMG，将 Agent Switch 拖入“应用程序”；CLI 用户解压 ZIP 并将 agent-switch 放入 PATH。Codex CLI / Claude Code 需单独安装。应用采用 ad-hoc 签名、未公证，请先核对校验和；确认信任来源后，可在“隐私与安全性”中选择“仍要打开”。\n\n'
          notes += 'These packages are for Apple Silicon; the Windows packages (NSIS, MSI and CLI ZIP) are added to this same release. Intel and Linux users can build from source.\n'
          (Path(os.environ['RUNNER_TEMP']) / 'release-notes.md').write_text(notes)
      - name: Publish packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release-state.json" 2>/dev/null; then
            test "$(node -p 'require(process.argv[1]).isDraft' "$RUNNER_TEMP/release-state.json")" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Agent Switch $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/release/"* --clobber
          gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --draft=false --latest
  verify-macos-installer:
    needs: release
    env:
      EXPECTED_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      # Authenticate the installer's API calls: runner egress IPs are shared
      # and unauthenticated calls hit the 60/hour rate limit (HTTP 403).
      GITHUB_TOKEN: ${{ github.token }}
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test installer response formats and platform selection
        run: python3 -m unittest discover -s tests -p 'test_install.py'
      - name: Verify public macOS installation
        shell: bash
        run: |
          # Allow GitHub's public API and asset replicas to catch up after publishing.
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if OUTPUT=$(curl -fsSL https://raw.githubusercontent.com/AntyRia/agent-switch/main/scripts/install.sh | AGENT_SWITCH_INSTALL_DIR="$RUNNER_TEMP/install-check" /bin/sh 2>&1); then
              printf '%s\n' "$OUTPUT"
              VERSION="$("$RUNNER_TEMP/install-check/agent-switch" --version)"
              if [ -z "$EXPECTED_TAG" ] || [ "$VERSION" = "agent-switch ${EXPECTED_TAG#v}" ]; then
                ok=1
                break
              fi
            fi
            [ "$attempt" = 8 ] || sleep 15
          done
          if [ "$ok" != 1 ]; then
            printf '::error::Public installer did not reach the expected release: %s\n' "${OUTPUT//$'\n'/'%0A'}"
            exit 1
          fi
          echo "::notice::Installed $VERSION through the public macOS installer"

  verify-windows-installer:
    needs: release
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Windows package selection after macOS release
        shell: pwsh
        env:
          # Same rate-limit reason as the macOS verification job.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          try {
            ./scripts/install.ps1
            if ($LASTEXITCODE -ne 0) { throw "Installed CLI exited with $LASTEXITCODE" }
          } catch {
            $message = $_.Exception.Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows installer::$message"
            exit 1
          }
          Write-Output "::notice::Installed $(agent-switch --version) through the Windows installer"
