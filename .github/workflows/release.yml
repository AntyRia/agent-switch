# Full multi-platform release pipeline.
#
# Push a version tag from ANY machine (the Windows dev box, a remote Mac, or
# nowhere) and this builds every platform in parallel on GitHub's cloud
# runners, then publishes ONE complete release. No local builds or manual
# uploads are required:
#
#   git tag v0.2.5 && git push origin v0.2.5
#
# Job graph:
#   create-release (draft)
#     ├── windows   (windows-latest)  NSIS + MSI + CLI zip, runs `cargo test`
#     ├── macos     (macos-15)        DMG + CLI zip (Apple Silicon)
#     └── linux     (ubuntu-latest)   CLI zip (x64)
#   checksums       (needs all three) merges SHA256SUMS.txt, enforces the set
#   publish         (needs checksums) flips the draft public
#   verify-*        end-to-end public install (macOS + Windows)
#
# The release is only un-drafted after every platform's assets and the merged
# SHA256SUMS.txt are present, so an incomplete release never goes public.
name: Release

on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/install.*'
      - 'tests/test_install.py'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------ #
  # Create the (draft) release once, up front, so the per-platform jobs
  # can upload into it in parallel. The tag must match the version baked
  # into desktop/package.json or we fail before building anything.
  # ------------------------------------------------------------------ #
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check version matches tag
        run: test "${RELEASE_TAG#v}" = "$(node -p 'require("./desktop/package.json").version')"
      - name: Prepare release notes
        shell: python
        run: |
          import os
          from pathlib import Path
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          changelog = Path('CHANGELOG.md').read_text()
          section = changelog.split(f'## [{version}]', 1)[1].split('\n## [', 1)[0]
          notes = f'Agent Switch {version}\n\n' + section.split('\n', 1)[1].strip()
          notes += (
            '\n\n### Packages\n\n'
            f'- **Windows x64**: `Agent.Switch_{version}_x64-setup.exe` (NSIS), '
            f'`Agent.Switch.Setup.{version}.x64.msi`, '
            f'`agent-switch-{version}-x86_64-pc-windows-msvc.zip` (CLI)\n'
            f'- **macOS (Apple Silicon)**: `Agent.Switch_{version}_aarch64.dmg`, '
            f'`agent-switch-{version}-aarch64-apple-darwin.zip` (CLI)\n'
            f'- **Linux x64**: `agent-switch-{version}-x86_64-unknown-linux-gnu.zip` (CLI)\n'
            '\n### Installation / 安装\n\n'
            'macOS: open the DMG and drag Agent Switch to Applications. '
            'Windows: run the NSIS installer (or the MSI). '
            'CLI: `irm .../install.ps1 | iex` (Windows) or `curl .../install.sh | sh` (macOS/Linux), '
            'or extract the CLI ZIP and put agent-switch on PATH. '
            'Codex CLI / Claude Code must be installed separately.\n\n'
            'macOS: 打开 DMG，将 Agent Switch 拖入"应用程序"。Windows: 运行 NSIS 安装程序（或 MSI）。'
            'CLI: Windows 用 `irm .../install.ps1 | iex`，macOS/Linux 用 `curl .../install.sh | sh`，'
            '或解压 CLI ZIP 并将 agent-switch 放入 PATH。Codex CLI / Claude Code 需单独安装。\n\n'
            'The macOS app is ad-hoc signed and not notarized by Apple; the Windows installer is '
            'not code-signed. Verify against SHA256SUMS.txt before opening. If macOS blocks an app '
            'you trust, use System Settings > Privacy & Security > Open Anyway.\n\n'
            'macOS 应用为 ad-hoc 签名、未由 Apple 公证；Windows 安装程序未做代码签名。打开前请先核对 '
            'SHA256SUMS.txt。确认信任来源后，可在"隐私与安全性"中选择"仍要打开"。\n\n'
            'Intel Mac and Linux ARM64 have no prebuilt packages yet; build from source.\n'
            'Intel Mac 与 Linux ARM64 暂无预编译包，请从源码构建。\n'
          )
          (Path(os.environ['RUNNER_TEMP']) / 'release-notes.md').write_text(notes)
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/r.json" 2>/dev/null; then
            test "$(node -p 'require(process.argv[1]).isDraft' "$RUNNER_TEMP/r.json")" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Agent Switch $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

  # ------------------------------------------------------------------ #
  # Per-platform builders. Each runs on the matching cloud runner, builds
  # natively, and uploads its own assets into the shared draft release.
  # Running `cargo test` on the Windows runner here is what catches the
  # Windows-only compile/test errors a macOS-only CI cannot see.
  # ------------------------------------------------------------------ #
  windows:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    needs: create-release
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUST_TARGET: x86_64-pc-windows-msvc
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Test and build CLI
        shell: bash
        run: |
          cargo test --locked --workspace
          cargo build --locked --release --target "$RUST_TARGET"
      - name: Build GUI
        shell: bash
        working-directory: desktop
        run: |
          npm ci
          npx tsc --noEmit
          npm run tauri build -- --target "$RUST_TARGET" --bundles nsis,msi --ci -- --locked
      - name: Verify and package
        shell: pwsh
        run: |
          $Version = "$env:RELEASE_TAG".TrimStart('v')
          $Build = Join-Path $env:CARGO_TARGET_DIR "$env:RUST_TARGET/release"
          $Out = Join-Path $env:RUNNER_TEMP 'release'
          New-Item -ItemType Directory -Force -Path $Out | Out-Null
          # Braced ${Version}: in PowerShell an unbraced $Version_x64 would be
          # read as the (undefined) variable "Version_x64" and expand to empty.
          Copy-Item (Join-Path $Build "bundle\nsis\Agent Switch_${Version}_x64-setup.exe") (Join-Path $Out "Agent.Switch_${Version}_x64-setup.exe")
          Copy-Item (Join-Path $Build "bundle\msi\Agent Switch_${Version}_x64_en-US.msi") (Join-Path $Out "Agent.Switch.Setup.${Version}.x64.msi")
          Compress-Archive -Path (Join-Path $Build 'agent-switch.exe') -DestinationPath (Join-Path $Out "agent-switch-${Version}-x86_64-pc-windows-msvc.zip") -Force
          Get-ChildItem $Out | Format-Table Name, Length
      - name: Upload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Out = Join-Path $env:RUNNER_TEMP 'release'
          gh release upload $env:RELEASE_TAG (Get-ChildItem $Out -File).FullName --clobber

  macos:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-15
    needs: create-release
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUST_TARGET: aarch64-apple-darwin
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Check platform and version
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          test "${RELEASE_TAG#v}" = "$(node -p 'require("./desktop/package.json").version')"
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$RUST_TARGET"
      - name: Test and build CLI
        shell: bash
        run: |
          python3 -m unittest discover -s tests -p 'test_install.py'
          cargo test --locked --target "$RUST_TARGET"
          cargo build --locked --release --target "$RUST_TARGET"
          test "$("$CARGO_TARGET_DIR/$RUST_TARGET/release/agent-switch" --version)" = "agent-switch ${RELEASE_TAG#v}"
      - name: Build GUI
        shell: bash
        working-directory: desktop
        run: |
          npm ci
          npx tsc --noEmit
          npm run tauri build -- --target "$RUST_TARGET" --bundles dmg --ci -- --locked
      - name: Verify and package
        shell: bash
        run: |
          verify() {
            local output
            if output=$("$@" 2>&1); then
              printf '%s\n' "$output"
            else
              output="${output//'%'/'%25'}"
              output="${output//$'\n'/'%0A'}"
              output="${output//$'\r'/'%0D'}"
              printf '::error title=Package verification::%s: %s\n' "$1" "$output"
              return 1
            fi
          }
          VERSION="${RELEASE_TAG#v}"
          OUT="$RUNNER_TEMP/release"
          BUILD="$CARGO_TARGET_DIR/$RUST_TARGET/release"
          mkdir -p "$OUT"
          verify cp "$BUILD/bundle/dmg/Agent Switch_${VERSION}_aarch64.dmg" "$OUT/Agent.Switch_${VERSION}_aarch64.dmg"
          verify hdiutil verify "$OUT/Agent.Switch_${VERSION}_aarch64.dmg"
          MOUNT="$RUNNER_TEMP/dmg-check"
          mkdir -p "$MOUNT"
          verify hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT" "$OUT/Agent.Switch_${VERSION}_aarch64.dmg"
          trap 'hdiutil detach "$MOUNT" -quiet || true' EXIT
          verify codesign --verify --deep --strict "$MOUNT/Agent Switch.app"
          verify hdiutil detach "$MOUNT"
          trap - EXIT
          ARCH="$(lipo -archs "$BUILD/agent-switch")"
          if [ "$ARCH" != arm64 ]; then
            echo "::error::Expected an arm64 CLI, found $ARCH"
            exit 1
          fi
          zip -j "$OUT/agent-switch-${VERSION}-aarch64-apple-darwin.zip" "$BUILD/agent-switch"
      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/release/"* --clobber

  linux:
    # CLI only — the update system and install.sh ship no Linux GUI, so no
    # Tauri build and no webkit/gtk dependencies are needed. x64 is built
    # natively; add an aarch64 cross build (gcc-aarch64-linux-gnu + a second
    # zip) here later for ARM64 Linux.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: create-release
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUST_TARGET: x86_64-unknown-linux-gnu
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Toolchain and target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$RUST_TARGET"
      - name: Test and build CLI
        run: |
          python3 -m unittest discover -s tests -p 'test_install.py'
          cargo test --locked --target "$RUST_TARGET"
          cargo build --locked --release --target "$RUST_TARGET"
      - name: Package
        run: |
          VERSION="${RELEASE_TAG#v}"
          OUT="$RUNNER_TEMP/release"
          BUILD="$CARGO_TARGET_DIR/$RUST_TARGET/release"
          mkdir -p "$OUT"
          test "$("$BUILD/agent-switch" --version)" = "agent-switch ${VERSION}"
          zip -j "$OUT/agent-switch-${VERSION}-x86_64-unknown-linux-gnu.zip" "$BUILD/agent-switch"
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/release/"* --clobber

  # ------------------------------------------------------------------ #
  # Download everything that landed in the release, require the full
  # multi-platform asset set to be present, then merge a single
  # SHA256SUMS.txt over all of it (self-verified) and upload it. The
  # updater verifies downloaded packages against this file.
  # ------------------------------------------------------------------ #
  checksums:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      # gh release download resolves the tag through a local git repo, so the
      # repo must be checked out even though this step only reads the assets.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Merge SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          VERSION="${RELEASE_TAG#v}"
          OUT="$RUNNER_TEMP/assets"
          mkdir -p "$OUT"
          gh release download "$RELEASE_TAG" --dir "$OUT" --clobber
          expected="
            Agent.Switch_${VERSION}_x64-setup.exe
            Agent.Switch.Setup.${VERSION}.x64.msi
            agent-switch-${VERSION}-x86_64-pc-windows-msvc.zip
            Agent.Switch_${VERSION}_aarch64.dmg
            agent-switch-${VERSION}-aarch64-apple-darwin.zip
            agent-switch-${VERSION}-x86_64-unknown-linux-gnu.zip
          "
          for name in $expected; do
            test -f "$OUT/$name" || { echo "::error::Missing release asset: $name"; exit 1; }
          done
          rm -f "$OUT/SHA256SUMS.txt"
          ( cd "$OUT" && sha256sum * > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt )
          cat "$OUT/SHA256SUMS.txt"
          gh release upload "$RELEASE_TAG" "$OUT/SHA256SUMS.txt" --clobber

  # ------------------------------------------------------------------ #
  # Flip the draft public only once every platform and the checksums are in.
  # ------------------------------------------------------------------ #
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: checksums
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      # Same as checksums: gh release edit needs a checked-out git repo to
      # resolve the tag, so this job checks out even though it runs no build.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest

  # ------------------------------------------------------------------ #
  # End-to-end install of the public release. On a tag these run after
  # publish; on main (tag jobs skipped) they smoke-test whatever is already
  # published, as a regression gate. Tokens are passed so the installers'
  # API calls don't hit the shared-IP rate limit (HTTP 403).
  # ------------------------------------------------------------------ #
  verify-macos-installer:
    needs: [publish]
    if: always() && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: macos-15
    timeout-minutes: 10
    env:
      EXPECTED_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test installer response formats and platform selection
        run: python3 -m unittest discover -s tests -p 'test_install.py'
      - name: Verify public macOS installation
        shell: bash
        run: |
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if OUTPUT=$(curl -fsSL https://raw.githubusercontent.com/AntyRia/agent-switch/main/scripts/install.sh | AGENT_SWITCH_INSTALL_DIR="$RUNNER_TEMP/install-check" /bin/sh 2>&1); then
              printf '%s\n' "$OUTPUT"
              VERSION="$("$RUNNER_TEMP/install-check/agent-switch" --version)"
              if [ -z "$EXPECTED_TAG" ] || [ "$VERSION" = "agent-switch ${EXPECTED_TAG#v}" ]; then
                ok=1
                break
              fi
            fi
            [ "$attempt" = 8 ] || sleep 15
          done
          if [ "$ok" != 1 ]; then
            printf '::error::Public installer did not reach the expected release: %s\n' "${OUTPUT//$'\n'/'%0A'}"
            exit 1
          fi
          echo "::notice::Installed $VERSION through the public macOS installer"

  verify-windows-installer:
    needs: [publish]
    if: always() && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Windows package selection after release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          try {
            ./scripts/install.ps1
            if ($LASTEXITCODE -ne 0) { throw "Installed CLI exited with $LASTEXITCODE" }
          } catch {
            $message = $_.Exception.Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows installer::$message"
            exit 1
          }
          Write-Output "::notice::Installed $(agent-switch --version) through the Windows installer"
